<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi viaje curricular — Diseño Curricular 2026</title><style>:root{--ink:#18324a;--muted:#607487;--line:#dbe4ec;--card:#fff;--accent:#246b8f;--ok:#24734d;--danger:#a33a3a}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef5f8,#faf7f1);color:var(--ink)}main{max-width:1000px;margin:auto;padding:28px 18px 50px}.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 12px 35px #18324a12}h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}h2{margin-top:0}p{line-height:1.55}.subtitle{color:var(--muted);font-size:17px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:18px;box-shadow:0 8px 24px #18324a0d}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #c9d6df;border-radius:12px;padding:13px;background:#fff}textarea{min-height:145px;resize:vertical}button{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;margin-top:10px}button.secondary{background:#e8eef2;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.choice{min-height:150px;text-align:left;padding:22px;background:#fff;color:var(--ink);border:1px solid var(--line)}.choice strong{display:block;font-size:20px;margin-bottom:8px}.choice span{font-weight:400;color:var(--muted)}.message{margin-top:12px;font-weight:600}.ok{color:var(--ok)}.err{color:var(--danger)}.small{font-size:13px;color:var(--muted)}.preview{max-width:100%;max-height:300px;border-radius:14px;border:1px solid var(--line);margin-top:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#edf3f6;color:var(--accent);font-size:13px;font-weight:700}@media(max-width:720px){.grid{grid-template-columns:1fr}.hero,.card{padding:19px}}</style></head><body><main><section class="hero"><div class="top"><span class="badge">Universidad Santiago de Cali · Maestría en Educación</span><span class="small">Diseño Curricular · 2026</span></div><h1>Mi viaje curricular</h1><p class="subtitle">Una experiencia de apertura para reconocer nuestras ideas y expectativas antes de iniciar el recorrido por el diseño curricular.</p><div id="app"></div></section></main><script>
const API="https://trbfzvaakcopikqlnsmk.supabase.co/functions/v1/mi-viaje-curricular";let student=null;const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,opts={}){try{const r=await fetch(API+path,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(!r.ok)throw Error(d.error||"No fue posible guardar la información.");return Array.isArray(d)?(d[0]||d):d}catch(e){if(e instanceof TypeError)throw Error("No se pudo conectar con el servidor. Verifica tu conexión e inténtalo nuevamente.");throw e}}
function render(){document.querySelector("#app").innerHTML=student?home():register()}
function register(){return '<div class="card"><h2>Comencemos el viaje</h2><p>Registra tu nombre y apellido para participar en las actividades.</p><input id="name" placeholder="Nombre y apellido" autocomplete="name"><button onclick="reg()">Ingresar</button><div id="msg" class="message"></div><p class="small">Capacidad de la experiencia: 40 participantes.</p></div>'}
function home(){return '<div class="card"><h2>Bienvenido/a, '+esc(student.full_name)+'</h2><p>Selecciona la actividad que deseas realizar.</p><div class="grid"><button class="choice" onclick="metaphor()"><strong>🧭 Metáfora</strong><span>Representa el currículo como un viaje mediante una imagen y explica tu elección.</span></button><button class="choice" onclick="expectations()"><strong>🎯 Expectativas</strong><span>Comparte qué esperas del curso, con un máximo de 150 palabras.</span></button></div></div>'}
async function reg(){const n=document.querySelector("#name").value.trim(),m=document.querySelector("#msg");if(n.length<3){m.innerHTML='<span class="err">Escribe tu nombre y apellido.</span>';return}try{student=await api("/students",{method:"POST",body:JSON.stringify({full_name:n})});render()}catch(e){m.innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
function metaphor(){document.querySelector("#app").innerHTML='<div class="card"><h2>🧭 Metáfora</h2><p><strong>“Cada currículo es un viaje que requiere de unos elementos y donde puede encontrar muchas cosas.”</strong></p><p>Selecciona una imagen que represente cómo comprendes esta idea y justifica tu elección.</p><input id="img" type="file" accept="image/*" onchange="previewImage(event)"><div id="prev"></div><textarea id="just" maxlength="2000" placeholder="Justifica tu respuesta..."></textarea><button onclick="saveMetaphor()">Guardar metáfora</button><button class="secondary" onclick="render()">Volver</button><div id="msg" class="message"></div></div>'}
function previewImage(e){const f=e.target.files[0],p=document.querySelector("#prev");if(!f){p.innerHTML="";return}const r=new FileReader();r.onload=()=>p.innerHTML='<img class="preview" src="'+r.result+'" alt="Vista previa">';r.readAsDataURL(f)}
async function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1200,s=Math.min(1,max/im.width,max/im.height),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.72))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function saveMetaphor(){const m=document.querySelector("#msg"),j=document.querySelector("#just").value.trim(),f=document.querySelector("#img").files[0];if(!f||!j){m.innerHTML='<span class="err">Selecciona una imagen y escribe la justificación.</span>';return}try{m.textContent="Guardando...";const data=await compress(f);if(data.length>1200000)throw Error("La imagen sigue siendo demasiado pesada. Selecciona otra imagen.");await api("/metaphors",{method:"POST",body:JSON.stringify({student_id:student.id,image_url:data,justification:j})});m.innerHTML='<span class="ok">Metáfora guardada correctamente.</span>'}catch(e){m.innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
function expectations(){document.querySelector("#app").innerHTML='<div class="card"><h2>🎯 Expectativas</h2><p>Escribe tus recomendaciones, intereses y expectativas frente al curso.</p><textarea id="exp" placeholder="Máximo 150 palabras..." oninput="countWords()"></textarea><div id="wc" class="small">0 / 150 palabras</div><button onclick="saveExpectation()">Guardar expectativa</button><button class="secondary" onclick="render()">Volver</button><div id="msg" class="message"></div></div>'}
function countWords(){const t=document.querySelector("#exp").value.trim(),n=t?t.split(/\s+/).filter(Boolean).length:0;const el=document.querySelector("#wc");el.textContent=n+" / 150 palabras";el.className=n>150?"small err":"small"}
async function saveExpectation(){const m=document.querySelector("#msg"),t=document.querySelector("#exp").value.trim(),n=t?t.split(/\s+/).filter(Boolean).length:0;if(!t){m.innerHTML='<span class="err">Escribe tu expectativa.</span>';return}if(n>150){m.innerHTML='<span class="err">Has superado el límite de 150 palabras.</span>';return}try{await api("/expectations",{method:"POST",body:JSON.stringify({student_id:student.id,text:t})});m.innerHTML='<span class="ok">Expectativa guardada correctamente.</span>'}catch(e){m.innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
render();</script></body></html>
